version: '3'

services:
  webserver:
    build:
      context: ./docker/nginx
      dockerfile: Dockerfile
    image: otus/nginx
    container_name: webserver
    ports:
      - "8089:80"
    volumes:
      - ./app/:/var/www/html
    networks:
      - app-network
  
  app:
    build:
      context: ./docker/fpm
      dockerfile: Dockerfile
    image: otus/php
    container_name: app
    env_file: .env
    volumes:
      - ./app/:/var/www/html
    networks:
      - app-network

  db:
    image: public.ecr.aws/docker/library/postgres:15.3
    shm_size: 1g
    restart: always
    container_name: db
    environment:
        POSTGRES_DB: '${POSTGRES_DB}'
        POSTGRES_PASSWORD: '${POSTGRES_PASSWORD}'
    ports:
        - 5432:5432
    volumes:
        - ./docker_data/:/var/lib/postgresql/data
    networks:
      - app-network

  adminer:
      image: public.ecr.aws/docker/library/adminer
      restart: always
      container_name: adminer
      depends_on:
          - db
      ports:
          - 8083:8080
      networks:
          - app-network

networks:
  app-network:
    driver: bridge